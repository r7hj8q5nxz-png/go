<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>升学通 - 为你节省时间</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- V0.7: 年度时间进度条 -->
        <div class="year-progress-bar" id="year-progress-bar">
            <div class="year-progress-content">
                <span class="year-progress-text" id="year-progress-text">2026 余额...</span>
            </div>
        </div>
        
        <!-- V1.1: 顶部情报仪表盘 -->
        <div class="dashboard-strip" id="dashboard-strip">
            <!-- V1.2: 个人节奏选择器 -->
            <div class="dashboard-pace">
                <span class="pace-label">我的阶段：</span>
                <div class="pace-selector">
                    <button class="pace-btn active" data-pace="">👀 查看全部</button>
                    <button class="pace-btn" data-pace="freshman">🟢 大一/大二</button>
                    <button class="pace-btn" data-pace="junior">🟡 大三/备考</button>
                    <button class="pace-btn" data-pace="senior">🔴 大四/冲刺</button>
                </div>
            </div>
            
            <!-- V1.7: 浏览模式切换 -->
            <div class="dashboard-view-mode">
                <span class="view-mode-label">浏览模式：</span>
                <div class="view-mode-selector">
                    <button class="view-mode-btn active" data-view="detailed">🧾 详细视图</button>
                    <button class="view-mode-btn" data-view="compact">👁️ 紧凑视图</button>
                </div>
            </div>
            
            <div class="dashboard-badge dashboard-badge-urgent" id="dashboard-urgent" title="只看紧急">
                <span class="badge-icon">🔥</span>
                <span class="badge-text">紧急</span>
                <span class="badge-count" id="urgent-count">0</span>
            </div>
            <div class="dashboard-badge dashboard-badge-approaching" id="dashboard-approaching" title="只看临近">
                <span class="badge-icon">⚠️</span>
                <span class="badge-text">临近</span>
                <span class="badge-count" id="approaching-count">0</span>
            </div>
            <div class="dashboard-badge dashboard-badge-starred" id="dashboard-starred" title="我的清单">
                <span class="badge-icon">⭐</span>
                <span class="badge-text">关注</span>
                <span class="badge-count" id="starred-count">0</span>
            </div>
            <div class="dashboard-badge dashboard-badge-cdut" id="dashboard-cdut" title="只看本校">
                <span class="badge-icon">🏫</span>
                <span class="badge-text">CDUT</span>
                <span class="badge-status" id="cdut-status">OFF</span>
            </div>
        </div>

        <header class="header">
            <h1>📋 升学通</h1>
            <p class="subtitle">将升学与竞赛信息压缩成一张卡片 · 节省你的时间 · 信息可信</p>
        </header>

        <div class="toolbar">
            <!-- V1.2: 视图切换 -->
            <div class="view-toggle-bar">
                <button class="view-btn active" data-view="list">≣ 列表</button>
                <button class="view-btn" data-view="month">📅 月份</button>
            </div>
            
            <div class="filter-bar">
                <!-- V0.9: 成都理工主权按钮（叠加开关） -->
                <button class="filter-btn cdut-only" id="cdut-only-btn">🏫 成都理工</button>
                <button class="filter-btn active" data-category="all">全部</button>
                <button class="filter-btn" data-category="升学">升学</button>
                <button class="filter-btn" data-category="竞赛">竞赛</button>
                <button class="filter-btn" data-category="关键节点">关键节点</button>
                <!-- V2.6.7 SAFE PATCH #2: POLICY CHIPS -->
                <button class="chip chip-policy chip-policy--all active" data-policy="all">全部层级</button>
                <button class="chip chip-policy chip-policy--national" data-policy="national">🇨🇳 国家级</button>
                <button class="chip chip-policy chip-policy--provincial" data-policy="provincial">🏛️ 省级</button>
            </div>
            
            <!-- V0.6: 快捷筛选栏 -->
            <div class="quick-filters">
                <label class="quick-filter-item">
                    <input type="checkbox" id="filter-not-expired" checked>
                    <span>仅看未过期</span>
                </label>
                <label class="quick-filter-item">
                    <input type="checkbox" id="filter-starred">
                    <span>只看关注⭐</span>
                </label>
                <label class="quick-filter-item">
                    <input type="checkbox" id="filter-urgent">
                    <span>只看紧急🔥</span>
                </label>
            </div>
            
            <div class="search-sort-bar">
                <input type="text" 
                       id="search-input" 
                       class="search-input" 
                       placeholder="搜索标题或关键词...">
                
                <select id="sort-select" class="sort-select">
                    <option value="deadline">按截止时间排序</option>
                    <option value="priority">按推荐程度排序</option>
                    <option value="urgency">紧迫优先</option>
                </select>
                
                <!-- V0.8: 学校/层级筛选 -->
                <select id="school-select" class="school-select">
                    <option value="all">全部信息</option>
                    <option value="CDUT">CDUT</option>
                    <option value="swjtu" disabled>西南交通大学 (即将上线)</option>
                    <option value="scu" disabled>四川大学 (即将上线)</option>
                </select>
                
                <button class="export-btn" id="export-btn" title="导出当前筛选结果">
                    📋 导出清单
                </button>
            </div>
        </div>

        <!-- V1.7: 学院快跳导航条 -->
        <div class="college-chips-container" id="college-chips-container">
            <div class="college-chips">
                <!-- 学院快跳芯片将通过 JavaScript 动态生成 -->
            </div>
        </div>

        <!-- 主内容区域：1 + 2 Grid 布局 -->
        <div class="main-content">
            <!-- 左侧 Sidebar (指挥看板) -->
            <aside class="sidebar">
                <h2 class="sidebar-title">📊 指挥看板</h2>
                <div id="sidebar-cards" class="sidebar-cards">
                    <!-- 置顶和高权重卡片将通过 JavaScript 动态生成 -->
                </div>
            </aside>

            <!-- 右侧 Main (情报区) -->
            <main class="main-area">
                <!-- 常用工具入口区域 -->
                <div class="tools-section">
                    <h2 class="tools-section-title">🧰 常用工具入口</h2>
                    <div class="tools-buttons">
                        <button class="tool-btn under-development" onclick="window.open('https://www.baidu.com/s?wd=' + encodeURIComponent('site:cdut.edu.cn 空闲教室查询'), '_blank');">
                            空闲教室查询入口（开发中）
                        </button>
                        <button class="tool-btn under-development" onclick="window.open('https://www.baidu.com/s?wd=' + encodeURIComponent('site:cdut.edu.cn 个人课表查询'), '_blank');">
                            个人课表查询入口（开发中）
                        </button>
                    </div>
                </div>

                <!-- 本周核心推荐区域 -->
                <div id="weekly-top3" class="weekly-top3">
                    <!-- 本周3件事将通过 JavaScript 动态生成 -->
                </div>

                <div id="cards-container" class="cards-grid">
                    <!-- 卡片将通过 JavaScript 动态生成 -->
                </div>
            </main>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在加载信息...</p>
        </div>

        <!-- 数据统计 -->
        <footer class="data-stats" id="data-stats">
            <!-- 统计信息将通过 JavaScript 动态生成 -->
        </footer>
    </div>

    <!-- 数据文件（必须在主逻辑之前加载） -->
    <script src="data/sources.js"></script>
    <script src="data/diagnosis.js"></script>
    <!-- 主逻辑 -->
    <script src="app.js"></script>
</body>
</html>
